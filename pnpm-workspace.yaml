# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# ============================================================================
#
# This setting requires that any npm package version must have been published
# for at least 1 day (1440 minutes) before pnpm will allow installing it.
# This is a critical defense against supply-chain attacks. In most cases,
# malicious npm releases are discovered and pulled within hours, so a 1-day
# delay provides a strong safety buffer.
#
# DO NOT DISABLE THIS SETTING. Removing or setting it to 0 is considered
# extremely dangerous and leaves the entire workspace vulnerable to supply-
# chain attacks, which have been the #1 vector for npm ecosystem compromises.
#
# If you absolutely need to install a package before the 1-day window has
# passed (e.g. an urgent security bugfix), you can add it to a
# `minimumReleaseAgeExclude` allowlist. Only consider doing this for packages
# released by trusted organizations with an impeccable security posture
# (e.g. react from Meta, typescript from Microsoft). Even then, remove the
# exclusion once the 1-day window has passed.
#
# Example:
#   minimumReleaseAgeExclude:
#     - react
#     - typescript
#
# ============================================================================
minimumReleaseAge: 1440

packages:
  - artifacts/*
  - scripts

catalog:
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  # Must be this exact version because expo requires it
  react: 19.1.0
  # Must be this exact version because expo requires it
  react-dom: 19.1.0
  tsx: ^4.21.0
  zod: ^3.25.76

autoInstallPeers: false

# Packages permitted to run install/postinstall scripts. (pnpm 10 called this
# `onlyBuiltDependencies`; pnpm 11 renamed it to `allowBuilds`. The old key was
# silently ignored, which is why installs kept failing with ERR_PNPM_IGNORED_BUILDS.)
allowBuilds:
  esbuild: true        # writes its platform binary shim during postinstall
  unrs-resolver: true  # napi native resolver used by the TS tooling chain

overrides:
  # NOTE: Replit's generated config excluded every non-linux-x64 native binary
  # here (esbuild, rollup, lightningcss, @tailwindcss/oxide, @expo/ngrok-bin).
  # That made installs smaller on Replit but breaks any build on Windows or
  # macOS, because pnpm then has no platform binary to resolve. Removed so the
  # repo builds wherever it is checked out — pnpm installs only the optional
  # dependencies matching the current platform anyway.
  esbuild: "0.27.3"
