kind = "mobile"
previewPath = "/"
title = "Bad Luck or Skill Issue?"
version = "1.0.0"
id = "artifacts/dice-tracker"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 22997

[services.development]
run = "pnpm --filter @workspace/dice-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dice-tracker", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/dice-tracker", "run", "serve" ]

[services.env]
PORT = "22997"
BASE_PATH = "/"
