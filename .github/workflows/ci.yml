name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # --frozen-lockfile makes an out-of-date lockfile a build failure rather
      # than something CI silently papers over.
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test — dice-tracker
        run: pnpm --filter @workspace/dice-tracker exec jest --no-coverage --ci

      - name: Test — api-server
        run: pnpm --filter @workspace/api-server run test

      # Proves the esbuild bundle still builds. This is the step that would have
      # caught the platform-binary exclusions that broke non-Linux checkouts.
      - name: Build — api-server
        run: pnpm --filter @workspace/api-server run build
